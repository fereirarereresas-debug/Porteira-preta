<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Animais - Porteira Preta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌾 Porteira Preta — Controle Rural</h1>
        <div class="header-buttons">
            <button onclick="location.href='contas.html'" class="btn btn-secondary">💰 Ir para Contas</button>
            <button onclick="logout()" class="btn btn-danger">🚪 Logout</button>
        </div>
    </header>
    
    <div class="container">
        <h2>🐄 Painel de Animais</h2>
        
        <div class="card">
            <h3>Registrar Novo Animal</h3>
            <form id="animalForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="animalNome">Nome do Animal</label>
                        <input type="text" id="animalNome" placeholder="Ex: Mimosa" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="animalTipo">Tipo</label>
                        <input type="text" id="animalTipo" placeholder="Ex: vaca, porco, frango" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="animalIdade">Idade</label>
                        <input type="text" id="animalIdade" placeholder="Ex: 2 anos" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="animalPeso">Peso</label>
                        <input type="text" id="animalPeso" placeholder="Ex: 450 kg" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="animalObs">Observações (opcional)</label>
                    <textarea id="animalObs" rows="3" placeholder="Adicione observações..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">✅ Registrar Animal</button>
            </form>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>📋 Animais Registrados (<span id="totalAnimais">0</span>)</h3>
                <button onclick="apagarTodosAnimais()" class="btn btn-danger">🗑️ Apagar Tudo</button>
            </div>
            
            <div id="successMessage" class="success-message" style="display: none;"></div>
            <div id="errorMessageAnimais" class="error-message" style="display: none;"></div>
            
            <div class="table-responsive">
                <table id="animaisTable">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Idade</th>
                            <th>Peso</th>
                            <th>Observações</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="animaisTableBody">
                        <tr>
                            <td colspan="6" class="empty-message">Nenhum animal registrado ainda</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2025 Porteira Preta — Orgulho do Campo Brasileiro 🌾</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
