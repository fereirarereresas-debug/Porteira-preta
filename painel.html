<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Animais - Porteira Preta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🌾 Porteira Preta — Controle Rural</h1>
            <nav>
                <button onclick="window.location.href='inseminacao.html'" class="btn btn-info">🐮 Inseminação</button>
                <button onclick="window.location.href='contas.html'" class="btn btn-secondary">💰 Contas</button>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <section class="card">
            <h2>🐄 Registro de Animais</h2>
            
            <form id="animalForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="animalName">Nome do Animal</label>
                        <input type="text" id="animalName" placeholder="Ex: Mimosa" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="animalType">Tipo</label>
                        <select id="animalType" required>
                            <option value="">Selecione</option>
                            <option value="Vaca">Vaca</option>
                            <option value="Boi">Boi</option>
                            <option value="Novilha">Novilha</option>
                            <option value="Bezerro">Bezerro</option>
                            <option value="Porco">Porco</option>
                            <option value="Frango">Frango</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="animalAge">Idade</label>
                        <input type="text" id="animalAge" placeholder="Ex: 2 anos" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="animalWeight">Peso</label>
                        <input type="text" id="animalWeight" placeholder="Ex: 450kg" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="animalObs">Observações (opcional)</label>
                    <textarea id="animalObs" placeholder="Informações adicionais..." rows="3"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">Registrar Animal</button>
            </form>
            
            <div id="message" class="message" style="display: none;"></div>
        </section>
        
        <section class="card">
            <div class="section-header">
                <h2>📋 Animais Registrados</h2>
                <div class="counter">Total: <span id="animalCount">0</span> animais</div>
            </div>
            
            <div class="table-actions">
                <button onclick="clearAllAnimals()" class="btn btn-danger-outline">🗑️ Apagar Tudo</button>
            </div>
            
            <div class="table-responsive">
                <table id="animalTable">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Idade</th>
                            <th>Peso</th>
                            <th>Observações</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="animalTableBody">
                        <tr class="empty-state">
                            <td colspan="6">Nenhum animal registrado ainda</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    
    <footer>
        <p>© 2025 Porteira Preta — Orgulho do Campo Brasileiro 🌾</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
