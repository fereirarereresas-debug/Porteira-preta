<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Porteira Preta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🌾 Porteira Preta</h1>
            <p class="subtitle">Controle Rural</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite o usuário" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite a senha" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Entrar</button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                
                <p class="warning-text">
                    ⚠️ Este login é apenas para demonstração. Não use em ambiente real.
                </p>
            </form>
        </div>
    </div>
    
    <footer>
        <p>© 2025 Porteira Preta — Orgulho do Campo Brasileiro 🌾</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
