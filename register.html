<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Gratuito - Porteira Preta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="logo-login">🌾</div>
            <h1>Criar Conta Gratuita</h1>
            <p class="subtitle">Preencha os dados abaixo para começar</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="regNome">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Nome Completo
                    </label>
                    <input type="text" id="regNome" placeholder="Seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        E-mail
                    </label>
                    <input type="email" id="regEmail" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="regPropriedade">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        Nome da Propriedade
                    </label>
                    <input type="text" id="regPropriedade" placeholder="Nome da fazenda/sítio" required>
                </div>
                
                <div class="form-group">
                    <label for="regUsername">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Nome de Usuário
                    </label>
                    <input type="text" id="regUsername" placeholder="Escolha um nome de usuário" required>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Senha
                    </label>
                    <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="regPasswordConfirm">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Confirmar Senha
                    </label>
                    <input type="password" id="regPasswordConfirm" placeholder="Digite a senha novamente" required minlength="6">
                </div>
                
                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer;">
                        <input type="checkbox" id="regTermos" required style="width: auto;">
                        <span style="font-size: 0.9rem;">
                            Concordo com os termos de uso e política de privacidade
                        </span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Criar Conta Grátis
                </button>
                
                <div id="registerMessage" class="message" style="display: none;"></div>
                
                <div style="margin-top: 25px; text-align: center; padding-top: 25px; border-top: 1px solid #e0e0e0;">
                    <p style="color: #666; font-size: 0.95rem;">
                        Já tem uma conta?
                        <a href="index.html" style="color: #2d5016; font-weight: 600; text-decoration: none;">
                            Fazer Login
                        </a>
                    </p>
                    <p style="margin-top: 10px;">
                        <a href="landing.html" style="color: #666; font-size: 0.9rem; text-decoration: none;">
                            ← Voltar para página inicial
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const registerForm = document.getElementById('registerForm');
        const registerMessage = document.getElementById('registerMessage');
        
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('regNome').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const propriedade = document.getElementById('regPropriedade').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            
            // Validações
            if (password !== passwordConfirm) {
                showRegisterMessage('As senhas não coincidem!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showRegisterMessage('A senha deve ter no mínimo 6 caracteres!', 'error');
                return;
            }
            
            // Verificar se usuário já existe
            let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            const usuarioExiste = usuarios.find(u => u.username === username || u.email === email);
            
            if (usuarioExiste) {
                showRegisterMessage('Usuário ou e-mail já cadastrado!', 'error');
                return;
            }
            
            // Criar novo usuário
            const novoUsuario = {
                id: Date.now(),
                nome: nome,
                email: email,
                propriedade: propriedade,
                username: username,
                password: password, // Em produção, use hash/criptografia
                dataCriacao: new Date().toISOString(),
                ultimoAcesso: null
            };
            
            usuarios.push(novoUsuario);
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            
            showRegisterMessage('✅ Conta criada com sucesso! Redirecionando...', 'success');
            
            // Fazer login automático e redirecionar
            setTimeout(() => {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userId', novoUsuario.id);
                sessionStorage.setItem('username', novoUsuario.username);
                sessionStorage.setItem('propriedade', novoUsuario.propriedade);
                window.location.href = 'dashboard.html';
            }, 2000);
        });
        
        function showRegisterMessage(text, type) {
            registerMessage.textContent = text;
            registerMessage.className = `message ${type}`;
            registerMessage.style.display = 'block';
            
            if (type === 'error') {
                setTimeout(() => {
                    registerMessage.style.display = 'none';
                }, 4000);
            }
        }
    </script>
</body>
</html>
